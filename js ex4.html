<script>
let R = 5;

let PI = Math.PI;


let circonference = 2 * PI * R;
let surfaceCercle = PI * R * R;

let surfaceSphere = 4 * PI * R * R;
let volumeSphere = (4/3) * PI * R * R * R;

console.log("Rayon R =", R);

console.log("Circonférence du cercle :", circonference.toFixed(2));
console.log("Surface du cercle :", surfaceCercle.toFixed(2));

console.log("Surface de la sphère :", surfaceSphere.toFixed(2));
console.log("Volume de la sphère :", volumeSphere.toFixed(2));
</script>
