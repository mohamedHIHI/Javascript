<html><head>
<title>Suppression avec remove()</title>
</head><body><div id="bloc">
<p id="monElement">ce paragraphe sera supprimé</p>
</div>
<button onclick="supprimer()">supprimer le paragraphe</button>
<script>
function supprimer(){
var ss=document.getElementById("monElement");
ss.remove();}
</script></body></html>
